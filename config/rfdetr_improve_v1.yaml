model:
  name: RF-DETR
  variant: RFDETRMedium
  pretrained: true
training:
  epochs: 80
  patience: 10
  imgsz: 640
  batch_size: 16
  grad_accum_steps: 1
  workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  device: 0
  seed: 42
  eval_interval: 1
  checkpoint_interval: 1
  lr_encoder: 0.00015
  resume: true
evaluation:
  eval_conf: 0.01
  cm_conf: 0.25
  iou_step: 0.05
  benchmark_warmup: 20
loss_weights:
  loss_ce: 1.0
  loss_bbox: 5.0
  loss_giou: 2.0
outputs:
  checkpoint_dir: /vol/checkpoints/rfdetr_improve_v1
  log_dir: /vol/logs/rfdetr_improve_v1
  eval_dir: /vol/outputs/rfdetr_eval_improve_v1
